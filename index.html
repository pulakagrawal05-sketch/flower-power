<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Flower Garden</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>My Flower Garden</h1>
    <p>A tiny page with a few blooming flowers</p>
  </header>

  <main class="garden">
    <!-- Flower 1: Pink -->
    <div class="flower pink">
      <div class="bloom">
        <span class="petal"></span><span class="petal"></span><span class="petal"></span>
        <span class="petal"></span><span class="petal"></span><span class="petal"></span>
        <span class="petal"></span><span class="petal"></span>
        <div class="center"></div>
      </div>
      <div class="stem"><span class="leaf left"></span><span class="leaf right"></span></div>
    </div>

    <!-- Flower 2: Yellow (sunflower-like) -->
    <div class="flower yellow tall">
      <div class="bloom">
        <span class="petal"></span><span class="petal"></span><span class="petal"></span>
        <span class="petal"></span><span class="petal"></span><span class="petal"></span>
        <span class="petal"></span><span class="petal"></span>
        <div class="center brown"></div>
      </div>
      <div class="stem"><span class="leaf left"></span><span class="leaf right"></span></div>
    </div>

    <!-- Flower 3: Purple -->
    <div class="flower purple">
      <div class="bloom">
        <span class="petal"></span><span class="petal"></span><span class="petal"></span>
        <span class="petal"></span><span class="petal"></span><span class="petal"></span>
        <span class="petal"></span><span class="petal"></span>
        <div class="center"></div>
      </div>
      <div class="stem"><span class="leaf left"></span><span class="leaf right"></span></div>
    </div>

    <!-- Flower 4: Red -->
    <div class="flower red tall">
      <div class="bloom">
        <span class="petal"></span><span class="petal"></span><span class="petal"></span>
        <span class="petal"></span><span class="petal"></span><span class="petal"></span>
        <span class="petal"></span><span class="petal"></span>
        <div class="center"></div>
      </div>
      <div class="stem"><span class="leaf left"></span><span class="leaf right"></span></div>
    </div>
  </main>

  <div class="ground"></div>

  <footer>Made with HTML &amp; CSS</footer>
</body>
</html>
